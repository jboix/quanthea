# quanthea with its data, its keys and its configuration file. See docs/deployment.md.
#
#   cp .env.example .env        # then fill in the secrets quanthea.yaml refers to
#   docker compose up -d
#
# quanthea generates its keys in the `keys` volume on first start. Back up `data` and `keys`
# apart: whoever holds both reads everything.
name: quanthea

services:
  quanthea:
    image: ghcr.io/jboix/quanthea:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/data
      - keys:/keys
      # Read at startup: restart quanthea after an edit.
      - ./quanthea.yaml:/etc/quanthea/quanthea.yaml:ro

volumes:
  data:
  keys:
