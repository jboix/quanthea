# yaml-language-server: $schema=../../../docs/configuration.schema.json
#
# Anthropic as the screenshots' model, the default: `bun run screenshots`, with ANTHROPIC_API_KEY.
# Haiku talks and plans; Sonnet builds, as quanthea suggests for Anthropic.

model:
  defaultProviderId: anthropic
  # A report thread's prompts are long: three repaired builds can pass the default 1,000,000.
  limits:
    threadTokens: 3000000
    toolCallsPerTurn: 25
    repairAttempts: 3
  providers:
    - id: anthropic
      name: Anthropic
      provider: anthropic
      baseUrl: https://api.anthropic.com/v1
      models:
        plan: claude-haiku-4-5
        build: claude-sonnet-5
        repair: ''
        metadata: claude-haiku-4-5
        answer: claude-haiku-4-5
      apiKey: ${ANTHROPIC_API_KEY}
