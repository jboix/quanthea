# yaml-language-server: $schema=../../docs/configuration.schema.json
#
# The instance the documentation's screenshots are taken on: four people and the dev data sources of
# `bun run env:up`. The model comes from models/<provider>.yaml, Anthropic by default: `bun run
# screenshots` puts both files in dev/screenshots/.state/config, which git ignores, and starts it.

server:
  publicUrl: http://localhost:3990

users:
  ana.keller@example.com:
    name: Ana Keller
    role: admin
    password: ${QUANTHEA_SHOTS_PASSWORD}
  marco.rossi@example.com:
    name: Marco Rossi
    role: editor
    password: ${QUANTHEA_SHOTS_PASSWORD}
  lea.fischer@example.com:
    name: Lea Fischer
    role: analyst
    password: ${QUANTHEA_SHOTS_PASSWORD}
  tom.weber@example.com:
    name: Tom Weber
    role: viewer
    password: ${QUANTHEA_SHOTS_PASSWORD}

connectors:
  postgres-orders:
    kind: postgres
    accessLevel: 3
    config:
      host: localhost
      port: 5433
      database: orders
      username: dash_ro
      tls: disable
    secret:
      password: ${QUANTHEA_SHOTS_DB_PASSWORD}
    hiddenFields: [customers.email, customers.phone]
  prometheus-dev:
    kind: prometheus
    accessLevel: 3
    config:
      url: http://localhost:9091
