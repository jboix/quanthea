# Local data sources for development and integration tests: `bun run env:up`.
#
# - postgres: the orders database (dev/postgres), on localhost:5433. Users quanthea_admin
#   (password quanthea-dev) and the read-only dash_ro (password dash-ro-dev).
# - prometheus: the synthetic metrics, on localhost:9091. The last day and a half is backfilled from
#   dev/metrics/history.ts, the live metrics come from dev/metrics/serve.ts.
# - timescaledb (profile "timescale"): the orders database of dev/postgres on TimescaleDB, on
#   localhost:5434, with the hypertable order_events and the continuous aggregate orders_per_minute
#   (dev/timescaledb). Same users as postgres.
# - mysql and mariadb (profile "mysql"): the orders database (dev/mysql), on localhost:3307 and
#   localhost:3308. Users quanthea_admin (password quanthea-dev) and the read-only dash_ro (password
#   dash-ro-dev).
# - clickhouse (profile "clickhouse"): the orders database (dev/clickhouse), over HTTP on
#   localhost:8124. Users quanthea_admin (password quanthea-dev), and dash_ro, dash_ro_2 (readonly=2)
#   and dash_ro_1 (readonly=1), all with password dash-ro-dev.
# - trino (profile "trino"): a coordinator on localhost:8081 whose catalog orders is the dev Postgres
#   (dev/trino/catalog), read as its owner. No authentication: any user name is accepted.
# - elasticsearch and opensearch (profile "search"): single nodes without security, on
#   localhost:9201 and localhost:9202, with the request logs in daily indices logs-YYYY.MM.DD
#   (dev/log-seed), seeded by search-seed.
# - influxdb (profile "influxdb"): InfluxDB 3 Core on localhost:8186 (dev/influxdb), the database
#   telemetry with the request metrics of the incident, seeded by influxdb-seed. Token
#   apiv3_quanthea-dev-token.
# - valkey (profile "valkey"): Valkey on localhost:6380 (dev/valkey), the incident as hashes, sorted
#   sets and streams, seeded by valkey-seed. The default user (password quanthea-dev) can write; the
#   ACL user dash_ro (password dash-ro-dev) only reads.
# - mongodb (profile "mongodb"): MongoDB on localhost:27018 (dev/mongodb), the database shop with the
#   orders around the incident, the deploys and a view of the failed orders, seeded by mongodb-seed
#   through mongosh. quanthea_admin (password quanthea-dev) can write; dash_ro (password dash-ro-dev,
#   authentication database shop) only reads.
# - http-api (profile "http"): a JSON API over the incident (dev/http-api), on localhost:8085, with
#   its OpenAPI description at /openapi.json; /api routes need Authorization: Bearer dev-token.
# - loki (profile "loki"): on localhost:3101 (dev/loki), with the same logs, seeded by loki-seed.
#
# Every port listens on 127.0.0.1 only: the passwords above are in the repository.
#
# Every source tells the same story: deploy #481 of checkout-svc, yesterday at 12:02 UTC,
# and the errors that follow. Each `env:up` script runs dev/refresh.ts first, which removes the
# volumes seeded before today, so the incident is always yesterday. `bun run env:down` deletes all
# the data.

name: quanthea-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: quanthea_admin
      POSTGRES_PASSWORD: quanthea-dev
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # TCP only: during the init scripts the server listens on its socket alone.
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'quanthea_admin', '-d', 'orders']
      interval: 2s
      timeout: 3s
      retries: 60

  metrics-history:
    image: oven/bun:1.4.2-slim
    working_dir: /metrics
    volumes:
      - ./metrics:/metrics:ro
      - metrics-seed:/seed
    command: ['sh', '-c', '[ -f /seed/history.om ] || bun history.ts /seed/history.om']

  prometheus-backfill:
    image: prom/prometheus:v3.15.0
    depends_on:
      metrics-history:
        condition: service_completed_successfully
    volumes:
      - metrics-seed:/seed:ro
      - prometheus-data:/prometheus
    entrypoint: ['/bin/sh', '-c']
    command:
      - '[ -f /prometheus/.backfilled ] || (promtool tsdb create-blocks-from openmetrics /seed/history.om /prometheus && touch /prometheus/.backfilled)'

  metrics:
    image: oven/bun:1.4.2-slim
    working_dir: /metrics
    volumes:
      - ./metrics:/metrics:ro
    command: ['bun', 'serve.ts']

  prometheus:
    image: prom/prometheus:v3.15.0
    depends_on:
      prometheus-backfill:
        condition: service_completed_successfully
      metrics:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - '127.0.0.1:9091:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 2s
      timeout: 3s
      retries: 60

  timescaledb:
    profiles: [timescale]
    image: timescale/timescaledb:2.30.2-pg18
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: quanthea_admin
      POSTGRES_PASSWORD: quanthea-dev
      TIMESCALEDB_TELEMETRY: 'off'
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      # File by file: the image's own scripts in the same directory install the extension first.
      - ./postgres/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./postgres/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./postgres/03-roles.sql:/docker-entrypoint-initdb.d/03-roles.sql:ro
      - ./timescaledb/04-timescale.sql:/docker-entrypoint-initdb.d/04-timescale.sql:ro
      - timescaledb-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'quanthea_admin', '-d', 'orders']
      interval: 2s
      timeout: 3s
      retries: 90

  mysql:
    profiles: [mysql]
    image: mysql:26.7.0
    environment:
      MYSQL_DATABASE: orders
      MYSQL_USER: quanthea_admin
      MYSQL_PASSWORD: quanthea-dev
      MYSQL_ROOT_PASSWORD: quanthea-root-dev
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP only: during the init scripts the server listens on its socket alone.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'quanthea_admin', '-pquanthea-dev']
      interval: 2s
      timeout: 3s
      retries: 90

  mariadb:
    profiles: [mysql]
    image: mariadb:13.0.2
    environment:
      MARIADB_DATABASE: orders
      MARIADB_USER: quanthea_admin
      MARIADB_PASSWORD: quanthea-dev
      MARIADB_ROOT_PASSWORD: quanthea-root-dev
    ports:
      - '127.0.0.1:3308:3306'
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d:ro
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      timeout: 3s
      retries: 90

  clickhouse:
    profiles: [clickhouse]
    image: clickhouse/clickhouse-server:26.9.8.3-alpine
    environment:
      CLICKHOUSE_DB: orders
      CLICKHOUSE_USER: quanthea_admin
      CLICKHOUSE_PASSWORD: quanthea-dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
      - '127.0.0.1:8124:8123'
    volumes:
      - ./clickhouse:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      # Not on 127.0.0.1: during the init scripts the server listens there alone.
      test: ['CMD-SHELL', 'wget -q -O /dev/null "http://$$(hostname -i):8123/ping"']
      interval: 2s
      timeout: 3s
      retries: 90

  trino:
    profiles: [trino]
    image: trinodb/trino:483
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8081:8080'
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    healthcheck:
      test: ['CMD', '/usr/lib/trino/bin/health-check']
      interval: 3s
      timeout: 5s
      retries: 60

  elasticsearch:
    profiles: [search]
    image: elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '127.0.0.1:9201:9200'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s"']
      interval: 3s
      timeout: 5s
      retries: 60

  opensearch:
    profiles: [search]
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '127.0.0.1:9202:9200'
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s"']
      interval: 3s
      timeout: 5s
      retries: 60

  # Run once after the servers are up: bun run env:up:search does.
  search-seed:
    profiles: [search]
    image: oven/bun:1.4.2-slim
    working_dir: /dev-sources
    volumes:
      - ./:/dev-sources:ro
    command: ['bun', 'log-seed/seed-search.ts', 'http://elasticsearch:9200', 'http://opensearch:9200']

  influxdb:
    profiles: [influxdb]
    image: influxdb:3.12.0-core
    command:
      - influxdb3
      - serve
      - --node-id=dev
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --admin-token-file=/etc/influxdb3/admin-token.json
    ports:
      - '127.0.0.1:8186:8181'
    volumes:
      - ./influxdb/admin-token.json:/etc/influxdb3/admin-token.json:ro
      - influxdb-data:/var/lib/influxdb3
    healthcheck:
      test: ['CMD', 'curl', '-fs', '-H', 'Authorization: Bearer apiv3_quanthea-dev-token', 'http://127.0.0.1:8181/health']
      interval: 2s
      timeout: 3s
      retries: 60

  # Run once after InfluxDB is up: bun run env:up:influxdb does.
  influxdb-seed:
    profiles: [influxdb]
    image: oven/bun:1.4.2-slim
    working_dir: /dev-sources
    volumes:
      - ./:/dev-sources:ro
    command: ['bun', 'influxdb/seed.ts', 'http://influxdb:8181', 'apiv3_quanthea-dev-token']

  valkey:
    profiles: [valkey]
    image: valkey/valkey:9.1.2-alpine
    command:
      - valkey-server
      - --requirepass
      - quanthea-dev
      - --user
      - dash_ro
      - 'on'
      - '>dash-ro-dev'
      - '~*'
      - '+@read'
      - '-@dangerous'
      - '+info'
      - '+acl|whoami'
      - '+acl|dryrun'
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', '-a', 'quanthea-dev', '--no-auth-warning', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # Run once after Valkey is up: bun run env:up:valkey does.
  valkey-seed:
    profiles: [valkey]
    image: oven/bun:1.4.2-slim
    working_dir: /dev-sources
    volumes:
      - ./:/dev-sources:ro
    command: ['bun', 'valkey/seed.ts', 'redis://default:quanthea-dev@valkey:6379/0']

  mongodb:
    profiles: [mongodb]
    image: mongo:9.0.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: quanthea_admin
      MONGO_INITDB_ROOT_PASSWORD: quanthea-dev
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 }).ok']
      interval: 2s
      timeout: 5s
      retries: 30

  # Prints the seed script for mongosh: bun run env:up:mongodb runs it in the mongodb service.
  mongodb-seed:
    profiles: [mongodb]
    image: oven/bun:1.4.2-slim
    working_dir: /dev-sources
    volumes:
      - ./:/dev-sources:ro
    command: ['bun', 'mongodb/seed.ts']

  http-api:
    profiles: [http]
    image: oven/bun:1.4.2-slim
    working_dir: /dev-sources
    volumes:
      - ./:/dev-sources:ro
    command: ['bun', 'http-api/serve.ts']
    ports:
      - '127.0.0.1:8085:8080'
    healthcheck:
      test: ['CMD', 'bun', '-e', "const r = await fetch('http://127.0.0.1:8080/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30

  loki:
    profiles: [loki]
    image: grafana/loki:3.7.8
    command: ['-config.file=/etc/loki/config.yaml']
    ports:
      - '127.0.0.1:3101:3100'
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  # Run once after Loki is up: bun run env:up:loki does. It waits until Loki is ready.
  loki-seed:
    profiles: [loki]
    image: oven/bun:1.4.2-slim
    working_dir: /dev-sources
    volumes:
      - ./:/dev-sources:ro
    command: ['bun', 'log-seed/seed-loki.ts', 'http://loki:3100']

volumes:
  postgres-data:
  timescaledb-data:
  mysql-data:
  mariadb-data:
  clickhouse-data:
  elasticsearch-data:
  opensearch-data:
  loki-data:
  influxdb-data:
  valkey-data:
  mongodb-data:
  metrics-seed:
  prometheus-data:
