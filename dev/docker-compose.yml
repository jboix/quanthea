# Local data sources for development and integration tests: `bun run env:up`.
#
# - postgres: the orders database (dev/postgres), on localhost:5433. Users querent_admin
#   (password querent-dev) and the read-only dash_ro (password dash-ro-dev).
# - prometheus: the synthetic metrics, on localhost:9091. The last day and a half is backfilled from
#   dev/metrics/history.ts, the live metrics come from dev/metrics/serve.ts.
# - timescaledb (profile "timescale"): the orders database of dev/postgres on TimescaleDB, on
#   localhost:5434, with the hypertable order_events and the continuous aggregate orders_per_minute
#   (dev/timescaledb). Same users as postgres.
# - mysql and mariadb (profile "mysql"): the orders database (dev/mysql), on localhost:3307 and
#   localhost:3308. Users querent_admin (password querent-dev) and the read-only dash_ro (password
#   dash-ro-dev).
# - clickhouse (profile "clickhouse"): the orders database (dev/clickhouse), over HTTP on
#   localhost:8124. Users querent_admin (password querent-dev), and dash_ro, dash_ro_2 (readonly=2)
#   and dash_ro_1 (readonly=1), all with password dash-ro-dev.
# - trino (profile "trino"): a coordinator on localhost:8081 whose catalog orders is the dev Postgres
#   (dev/trino/catalog), read as its owner. No authentication: any user name is accepted.
# - elasticsearch and opensearch (profile "search"): single nodes without security, on
#   localhost:9201 and localhost:9202, with the request logs in daily indices logs-YYYY.MM.DD
#   (dev/log-seed), seeded by search-seed.
# - loki (profile "loki"): on localhost:3101 (dev/loki), with the same logs, seeded by loki-seed.
#
# Every source tells the same story: deploy #481 of checkout-svc, yesterday at 12:02 UTC,
# and the errors that follow. `bun run env:down` deletes the data; the next `env:up` seeds it again
# around the new yesterday.

name: querent-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: querent_admin
      POSTGRES_PASSWORD: querent-dev
    ports:
      - '5433:5432'
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # TCP only: during the init scripts the server listens on its socket alone.
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'querent_admin', '-d', 'orders']
      interval: 2s
      timeout: 3s
      retries: 60

  metrics-history:
    image: oven/bun:1.3.14-slim
    working_dir: /metrics
    volumes:
      - ./metrics:/metrics:ro
      - metrics-seed:/seed
    command: ['sh', '-c', '[ -f /seed/history.om ] || bun history.ts /seed/history.om']

  prometheus-backfill:
    image: prom/prometheus:v3.15.0
    depends_on:
      metrics-history:
        condition: service_completed_successfully
    volumes:
      - metrics-seed:/seed:ro
      - prometheus-data:/prometheus
    entrypoint: ['/bin/sh', '-c']
    command:
      - '[ -f /prometheus/.backfilled ] || (promtool tsdb create-blocks-from openmetrics /seed/history.om /prometheus && touch /prometheus/.backfilled)'

  metrics:
    image: oven/bun:1.3.14-slim
    working_dir: /metrics
    volumes:
      - ./metrics:/metrics:ro
    command: ['bun', 'serve.ts']

  prometheus:
    image: prom/prometheus:v3.15.0
    depends_on:
      prometheus-backfill:
        condition: service_completed_successfully
      metrics:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - '9091:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 2s
      timeout: 3s
      retries: 60

  timescaledb:
    profiles: [timescale]
    image: timescale/timescaledb:2.30.2-pg18
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: querent_admin
      POSTGRES_PASSWORD: querent-dev
      TIMESCALEDB_TELEMETRY: 'off'
    ports:
      - '5434:5432'
    volumes:
      # File by file: the image's own scripts in the same directory install the extension first.
      - ./postgres/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./postgres/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./postgres/03-roles.sql:/docker-entrypoint-initdb.d/03-roles.sql:ro
      - ./timescaledb/04-timescale.sql:/docker-entrypoint-initdb.d/04-timescale.sql:ro
      - timescaledb-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'querent_admin', '-d', 'orders']
      interval: 2s
      timeout: 3s
      retries: 90

  mysql:
    profiles: [mysql]
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: orders
      MYSQL_USER: querent_admin
      MYSQL_PASSWORD: querent-dev
      MYSQL_ROOT_PASSWORD: querent-root-dev
    ports:
      - '3307:3306'
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP only: during the init scripts the server listens on its socket alone.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'querent_admin', '-pquerent-dev']
      interval: 2s
      timeout: 3s
      retries: 90

  mariadb:
    profiles: [mysql]
    image: mariadb:11.8.9
    environment:
      MARIADB_DATABASE: orders
      MARIADB_USER: querent_admin
      MARIADB_PASSWORD: querent-dev
      MARIADB_ROOT_PASSWORD: querent-root-dev
    ports:
      - '3308:3306'
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d:ro
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      timeout: 3s
      retries: 90

  clickhouse:
    profiles: [clickhouse]
    image: clickhouse/clickhouse-server:26.8.15.10-alpine
    environment:
      CLICKHOUSE_DB: orders
      CLICKHOUSE_USER: querent_admin
      CLICKHOUSE_PASSWORD: querent-dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
      - '8124:8123'
    volumes:
      - ./clickhouse:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      # Not on 127.0.0.1: during the init scripts the server listens there alone.
      test: ['CMD-SHELL', 'wget -q -O /dev/null "http://$$(hostname -i):8123/ping"']
      interval: 2s
      timeout: 3s
      retries: 90

  trino:
    profiles: [trino]
    image: trinodb/trino:483
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8081:8080'
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    healthcheck:
      test: ['CMD', '/usr/lib/trino/bin/health-check']
      interval: 3s
      timeout: 5s
      retries: 60

  elasticsearch:
    profiles: [search]
    image: elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '9201:9200'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s"']
      interval: 3s
      timeout: 5s
      retries: 60

  opensearch:
    profiles: [search]
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '9202:9200'
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s"']
      interval: 3s
      timeout: 5s
      retries: 60

  # Run once after the servers are up: bun run env:up:search does.
  search-seed:
    profiles: [search]
    image: oven/bun:1.3.14-slim
    working_dir: /dev-sources
    volumes:
      - ./:/dev-sources:ro
    command: ['bun', 'log-seed/seed-search.ts', 'http://elasticsearch:9200', 'http://opensearch:9200']

  loki:
    profiles: [loki]
    image: grafana/loki:3.7.8
    command: ['-config.file=/etc/loki/config.yaml']
    ports:
      - '3101:3100'
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  # Run once after Loki is up: bun run env:up:loki does. It waits until Loki is ready.
  loki-seed:
    profiles: [loki]
    image: oven/bun:1.3.14-slim
    working_dir: /dev-sources
    volumes:
      - ./:/dev-sources:ro
    command: ['bun', 'log-seed/seed-loki.ts', 'http://loki:3100']

volumes:
  postgres-data:
  timescaledb-data:
  mysql-data:
  mariadb-data:
  clickhouse-data:
  elasticsearch-data:
  opensearch-data:
  loki-data:
  metrics-seed:
  prometheus-data:
