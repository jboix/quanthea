name: Evals

# Asks the agent the eval questions against the dev data sources, on the provider picked when the
# run starts: Google (Gemini) or Anthropic, or both, one job each. Each job starts from the models
# quanthea suggests for its provider. The summary shows on the run's page; the report, as an HTML
# page and as JSON, is the job's artifact; and evalmark records the run on the `evalmark` branch,
# where its dashboard keeps every run since. A job fails when more questions fail than allowed.
#
# Run by hand from main, by the repository's owner only. The jobs run in the `evals` environment,
# which holds the providers' API keys and deploys from main only, and each job gets only its own
# provider's key. Never part of the Quality workflow.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: The provider whose models answer
        type: choice
        options: [google, anthropic, both]
        default: google
        required: true
      only:
        description: Only these questions, such as q3,q7 (empty for all)
        default: ''
        required: false
      allowed-failures:
        description: How many questions may fail before a job fails
        default: '0'
        required: true

permissions: {}

jobs:
  evals:
    name: Evals (${{ matrix.provider }})
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: evals
    permissions:
      contents: write # evalmark pushes the run to the evalmark branch
    strategy:
      fail-fast: false # one provider failing still records the other
      matrix:
        provider: ${{ fromJSON(inputs.provider == 'both' && '["google","anthropic"]' || format('["{0}"]', inputs.provider)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.tool-versions'

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Start the dev data sources
        run: bun run env:up

      # Keeps the responses of earlier runs: a rerun on the same day with the
      # same prompts calls the provider only for what changed.
      - name: Restore the response cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: evals/.cache
          key: evals-cache-${{ matrix.provider }}-${{ github.run_id }}
          restore-keys: evals-cache-${{ matrix.provider }}-

      # Each job gets its own provider's key only.
      - name: Ask the questions
        env:
          GEMINI_API_KEY: ${{ matrix.provider == 'google' && secrets.GEMINI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          PROVIDER: ${{ matrix.provider }}
          ONLY: ${{ inputs.only }}
          ALLOWED_FAILURES: ${{ inputs.allowed-failures }}
        run: |
          set -- --provider "$PROVIDER" --allow-failures "$ALLOWED_FAILURES"
          if [ -n "$ONLY" ]; then set -- "$@" --only "$ONLY"; fi
          bun run evals "$@"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-report-${{ matrix.provider }}
          path: evals/reports/
          if-no-files-found: ignore

      # Records the run, failing questions included, on the evalmark branch. The keys are redacted
      # from anything stored, should an answer echo one.
      - name: Record the run with evalmark
        if: ${{ !cancelled() }}
        uses: jboix/evalmark@2485f026277f627591d4d0feb50a61b9f5f739b9 # v1.0.0
        with:
          result: evals/reports/evalmark.json
          title: quanthea
          subtitle: eval dashboard
          logo: docs/brand/quanthea-icon.svg
          comment: 'false'
          redact: |
            ${{ secrets.GEMINI_API_KEY }}
            ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Data source logs
        if: failure()
        run: docker compose -f dev/docker-compose.yml --profile '*' logs --no-color
