name: Scan

# Security scans, on the same schedule as CodeQL's default setup: every push to main, every pull
# request to main, and weekly, so a vulnerability published after a release still shows. Nothing
# here builds, publishes or deploys, no job uses an environment or a secret, and nothing fails a
# build: the findings go to the Security tab (code scanning) as SARIF, beside CodeQL's. On a pull
# request they show on the pull request; from a fork, whose token cannot upload, they stay in the
# job's log. Both tools run from their own actions, pinned by commit, which Dependabot updates
# with the other actions.
#
# zizmor audits the workflows. Trivy checks the Dockerfile and deploy/ for misconfigurations, and
# the released image, ghcr.io/jboix/quanthea:latest, for known vulnerabilities that have a fix.
# The Quality workflow keeps its own zizmor job, which fails the gate on a finding.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '41 5 * * 1'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.30.1
          inputs: .github
          advanced-security: ${{ !github.event.pull_request.head.repo.fork }}

  # dev/ holds the local data sources, with test passwords and open ports on purpose: it is skipped.
  trivy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: .
          skip-dirs: dev
          format: sarif
          output: trivy.sarif

      - name: Report
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-config

  trivy-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/jboix/quanthea:latest
          severity: HIGH,CRITICAL
          # A vulnerability Debian has not fixed yet cannot be fixed here: it is left out.
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy.sarif

      - name: Report
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-image
