name: Quality

on:
  merge_group:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.tool-versions'

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: bun install --frozen-lockfile

      # Every step is a package script, the same ones `bun run verify` chains,
      # so the pre-push hook and CI cannot drift apart.
      - name: Lint and format
        run: bun run lint

      - name: Docs format and links
        run: bun run docs:check

      - name: Architecture rules
        run: bun run arch

      - name: Dead code and unused dependencies
        run: bun run knip

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests with coverage
        run: bun run test:coverage

      # The total alone does not say where it comes from: these sets add the line coverage by
      # workspace, by server module and by part of the web app.
      - name: Coverage by area
        run: bun run coverage:areas

      - name: Build the SPA
        run: bun run build

      - name: Build the website
        run: bun run site:build

      - name: The publishable plugin kit (publint, attw)
        run: bun run check:package

      - name: Test coverage
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        env:
          OCTOCOV_CUSTOM_METRICS_AREAS: ${{ github.workspace }}/coverage/areas.json
        with:
          config: .github/octocov.yml

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t quanthea:ci .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Releases publish linux/amd64 and linux/arm64. The arm64 build needs no
      # emulation, so check it on every pull request.
      - name: Build the image for linux/arm64
        run: docker buildx build --platform linux/arm64 .

      - name: Serve the app from the image
        run: |
          docker run -d --name quanthea -p 3000:3000 quanthea:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/library | grep -q '<div id="root">'

      - name: Server logs
        if: always()
        run: docker logs quanthea || true

  integration:
    name: integration (${{ matrix.sources }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - sources: core
            up: env:up
            test: test:integration
          - sources: timescale
            up: env:up:timescale
            test: test:integration:timescale
          - sources: mysql
            up: env:up:mysql
            test: test:integration:mysql
          - sources: clickhouse
            up: env:up:clickhouse
            test: test:integration:clickhouse
          - sources: trino
            up: env:up:trino
            test: test:integration:trino
          - sources: search
            up: env:up:search
            test: test:integration:search
          - sources: loki
            up: env:up:loki
            test: test:integration:loki
          - sources: http
            up: env:up:http
            test: test:integration:http
          - sources: influxdb
            up: env:up:influxdb
            test: test:integration:influxdb
          - sources: valkey
            up: env:up:valkey
            test: test:integration:valkey
          - sources: mongodb
            up: env:up:mongodb
            test: test:integration:mongodb
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.tool-versions'

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Start the local data sources
        run: bun run ${{ matrix.up }}

      - name: Integration tests against the local data sources
        run: bun run ${{ matrix.test }}

      - name: Data source logs
        if: failure()
        run: docker compose -f dev/docker-compose.yml --profile '*' logs --no-color

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.tool-versions'

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Lint commit messages (Conventional Commits)
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" --verbose

  # The ruleset on main requires one check named `quality`. commitlint is
  # skipped outside pull requests, and a skipped job counts as passing.
  quality:
    needs: [verify, image, integration, commitlint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check every gate
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
