name: Release

# Cuts a release and publishes its Docker image, in one run, from main only:
#
#   packages -> semantic-release runs for @quanthea/plugin-kit alone
#               (packages/plugin-kit/.releaserc.json): it reads the commits that
#               changed packages/plugin-kit since the last plugin-kit-vX.Y.Z
#               tag, publishes the kit to npm through trusted publishing, tags
#               it and creates its GitHub Release. It makes no commit: the kit's
#               version lives in its tags. @quanthea/create-plugin follows the
#               same way (packages/create-plugin, its create-plugin-vX.Y.Z
#               tags), after the kit. Of the jobs that run project code, this
#               is the only one that can request an OIDC token, which npm
#               trusted publishing needs.
#   release  -> semantic-release reads the Conventional Commits on main, bumps
#               the version in package.json, commits it, tags vX.Y.Z and
#               creates the GitHub Release. It comes after the packages, so the
#               app's release is the latest one when several release.
#   image    -> builds the image at that tag for linux/amd64 and linux/arm64,
#               with its SBOM and provenance, and pushes it to GHCR as :vX.Y.Z
#               and :latest. A released image is never rebuilt.
#   sign     -> signs the pushed image by digest with cosign, keyless.
#   site     -> after an app release, starts the Website workflow on main, so
#               the site shows the new version. The version commit carries
#               [skip ci], so its push starts nothing.
#
# When main has no release-worthy commits, no tag is cut and no image is built.
#
# The quality workflow gates every commit on main, so the release runs no
# project checks. While the release bot token exists, what runs is npm,
# semantic-release and its plugins (dev dependencies, at the versions in
# bun.lock), and two project scripts that use Bun alone: the kit's stamp, which
# writes the cut version into the dist built before the token, and the
# generator's dist, which bundles with Bun. No other dev dependency, the
# TypeScript compiler included, runs with the token.
#
# The packages and release jobs run in the release environment, which holds the
# release bot's secrets and deploys from main only. That rests on settings no
# commit makes: the environment's branch policy, its secrets and npm's trusted
# publishers (see "Settings outside the repository" in docs/architecture.md).
# Dependencies install without their lifecycle scripts, and checkout keeps no
# credentials: semantic-release pushes with the token in its environment.

on:
  workflow_dispatch:

# One release at a time. A second dispatch waits for the first, never cancels it.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/quanthea

jobs:
  packages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing of the kit and the generator, with provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.tool-versions'

      - name: Setup Node.js (semantic-release runs on Node)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The version is pinned: zizmor's ad-hoc package audit has nothing left to check.
      - name: Update npm (trusted publishing needs npm 11.5.1 or later)
        run: npm install -g npm@11.21.0 # zizmor: ignore[adhoc-packages]

      # semantic-release and its plugins are dev dependencies, so the release
      # runs the exact versions in bun.lock rather than whatever the registry
      # serves at run time.
      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: bun install --frozen-lockfile --ignore-scripts

      # Both dist folders are built here, before the token exists: the kit's
      # declarations need the TypeScript compiler, a dev dependency. The kit's
      # prepare step only writes the cut version into dist/package.json. The
      # generator's prepare step builds its dist again, with Bun alone, so it
      # records the kit version the kit's run may just have tagged.
      - name: Build the packages
        run: |
          bun packages/plugin-kit/scripts/dist.ts
          bun packages/create-plugin/scripts/dist.ts

      - name: Mint the release bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # The kit's prepare step writes the version semantic-release cuts into
      # packages/plugin-kit/dist/package.json, then publishes the folder.
      - name: Semantic Release for the plugin kit (tag + GitHub Release + npm via OIDC)
        working-directory: packages/plugin-kit
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: bun run release:ci

      # The generator next, after the kit: a new generator release writes the
      # kit version the kit's run may just have tagged.
      - name: Semantic Release for the plugin generator (tag + GitHub Release + npm via OIDC)
        working-directory: packages/create-plugin
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: bun run release:ci

  release:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.tool-versions'

      - name: Setup Node.js (semantic-release runs on Node)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Mint the release bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Record the latest tag
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Semantic Release (version commit + tag + GitHub Release)
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: npx semantic-release

      - name: Resolve the released version
        id: version
        env:
          PREVIOUS: ${{ steps.before.outputs.tag }}
        run: |
          git fetch --tags --force --quiet
          latest="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$latest" ] && [ "$latest" != "$PREVIOUS" ]; then
            echo "released $latest"
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$latest" >> "$GITHUB_OUTPUT"
          else
            echo "nothing to release"
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  site:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Deploy the website from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main

  image:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The token reaches the script as a variable, never written into its text.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # The Dockerfile runs every RUN on the build platform, so the arm64 image
      # builds on this amd64 runner without emulation. The image carries its
      # SBOM and a full SLSA provenance as attestations.
      - name: Build and push the image (linux/amd64, linux/arm64)
        id: push
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file "$RUNNER_TEMP/metadata.json" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            --push \
            .
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")" >> "$GITHUB_OUTPUT"

  # Signs the pushed image by digest with cosign, keyless: the signature names
  # this workflow on main, and Sigstore's transparency log records it. It runs
  # apart from the build, so no project code runs with an OIDC token.
  sign:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write # the keyless signing certificate
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Sign the image
        run: |
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "no image digest: $DIGEST"; exit 1 ;;
          esac
          cosign sign --yes "$IMAGE@$DIGEST"
