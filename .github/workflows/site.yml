name: Website

# Builds apps/site and deploys it to GitHub Pages when main changes the site, the docs or what they
# read, and on demand; pull requests deploy nothing. Every build includes the docs of each released
# minor, read from its tag, and main's docs under docs/next/. The Release workflow starts it on
# main after an app release, since the footer shows the version and a new minor adds its docs. A
# release event would run it on the tag, which the github-pages environment refuses. The
# repository's Pages source must be "GitHub Actions" (Settings → Pages). The custom domain is the
# one set there: a deployment from Actions ignores a CNAME file, so the site has none. The eval
# dashboard, which evalmark keeps on the `evalmark` branch, is copied in at /evals/; the Evals
# workflow starts this one after its runs, so /evals/ shows them.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/site/**'
      - 'docs/**'
      - 'packages/tokens/**'
      - 'packages/shared/**'
      - 'README.md'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history with its tags: each released version's docs are read from its tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.tool-versions'

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: bun install --frozen-lockfile

      # Pages says where the site lives: the custom domain set in Settings → Pages, else
      # https://<owner>.github.io/<repository>/. The SITE_URL and SITE_BASE variables override it.
      - name: Read the Pages address
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the website
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          SITE_BASE: ${{ vars.SITE_BASE || steps.pages.outputs.base_path || '/' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run site:build

      # The eval dashboard and its runs, from the evalmark branch. Before the first eval run the
      # branch does not exist: the action warns and the site deploys without /evals/.
      - name: Add the eval dashboard at /evals/
        uses: jboix/evalmark@2485f026277f627591d4d0feb50a61b9f5f739b9 # v1.0.0
        with:
          mode: export
          path: apps/site/dist/evals

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
